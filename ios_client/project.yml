name: AudioStreamClient
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

targets:
  AudioStreamClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "PC 音频接收器"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "需要在局域网内连接你的电脑以接收音频"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.audiostream
        PRODUCT_NAME: AudioStreamClient
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_BITCODE: "NO"
